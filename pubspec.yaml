name: cash_management
description: "Cash Management App - control de finanzas en pareja"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.1
  dio: ^5.7.0
  socket_io_client: ^3.0.2
  drift: ^2.34.3
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  path: ^1.9.1
  fl_chart: ^1.2.0
  pdf: ^3.11.1
  printing: ^5.14.0
  flutter_local_notifications: ^22.2.0
  intl: ^0.20.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.4
  share_plus: ^13.3.0
  google_fonts: ^8.2.0
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon_app.png"

flutter:
  uses-material-design: true
  assets:
    - .env
